name: CD Deploy

# Deployment only:
# Run directly on push to main after PR CI and branch protection have already
# validated the merge, then publish the image and trigger Coolify.
on:
  push:
    branches:
      - main

# Ensure only one production deployment runs at a time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/lucaknobel/web-portfolio
      IMAGE_TAG_SHA: ${{ github.sha }}

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the image exactly once and load it into the local Docker daemon
      # so Trivy can scan the same artifact before we push it.
      # This workflow currently builds linux/amd64 only.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG_SHA }}

      # Security scan for the locally built image.
      # CRITICAL vulnerabilities with available fixes will fail this job.
      # This blocks the image push and prevents deploy job from running.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "${{ env.IMAGE }}:${{ env.IMAGE_TAG_SHA }}"
          format: "json"
          output: "reports/trivy-image.json"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true
          vuln-type: "os,library"
          exit-code: "1"
        # Continue on error to allow summary script to run; job failure still occurs due to exit-code: "1"
        continue-on-error: true

      # Always generate summary even if Trivy found critical issues
      - name: Trivy Summary
        if: always()
        run: bash .github/scripts/trivy-summary.sh reports/trivy-image.json image

      # Upload Trivy report for detailed analysis
      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-image
          path: reports/trivy-image.json
          retention-days: 30

      # Push the exact image that was scanned above.
      # This step only runs if Trivy scan succeeded (no continue-on-error).
      - name: Push image
        run: |
          docker push "${{ env.IMAGE }}:${{ env.IMAGE_TAG_SHA }}"
          docker push "${{ env.IMAGE }}:latest"

  deploy:
    name: Deploy to Coolify (Production)
    runs-on: ubuntu-latest
    environment: production

    needs: image

    permissions:
      contents: read

    steps:
      # Generate deployment summary in GitHub job summary
      - name: Deployment summary
        run: |
          {
            echo "## Production Deployment"
            echo ""
            echo "**Environment:** production"
            echo ""
            echo "**Commit:** ${{ github.sha }}"
            echo ""
            echo "**Image:** ghcr.io/lucaknobel/web-portfolio:${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Coolify pulls the freshly pushed image and restarts the application.
      - name: Trigger Coolify deploy webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_AUTH_TOKEN: ${{ secrets.COOLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_AUTH_TOKEN}" \
            "${COOLIFY_WEBHOOK}"
