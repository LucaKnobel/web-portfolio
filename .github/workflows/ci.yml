name: Pull Request CI Checks

# Trigger: Run quality checks, tests, and security scans on PRs to main or dev
# Ensures code meets standards before merging
on:
  pull_request:
    branches:
      - "main"
      - "dev"

# Cancel outdated runs on the same PR branch to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Give read access to repository contents for jobs
permissions:
  contents: read

jobs:
  quality:
    name: Quality - Typecheck, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Clone repository at PR commit
      - uses: actions/checkout@v7

      # Install Node.js 24 + npm cache
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Install dependencies including dev packages needed for checks and tests.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Run tests with coverage enabled; generates JSON report + coverage metrics
      - name: Tests
        run: npm run test:run -- --coverage

      # Verify the same Astro production build that the Docker image runs.
      - name: Build
        run: npm run build

      # Always run summary even if tests fail; uses if: always() to capture results
      - name: Test Summary
        if: always()
        run: bash .github/scripts/test-summary.sh

      # Upload test and coverage reports for detailed analysis
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports/
          retention-days: 30

  semgrep:
    name: Security - Semgrep (OSS auto config)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Clone code for static analysis
      - uses: actions/checkout@v7

      # Run local open-source Semgrep scan with automatic rules.
      - name: Install Semgrep
        run: python3 -m pip install --upgrade semgrep

      # ERROR is Semgrep's high/critical level; --error turns findings into a job failure.
      # Generate JSON report for structured output and analysis
      - name: Run Semgrep (auto config)
        run: semgrep scan --config auto --severity ERROR --error . --json --output reports/semgrep.json
        # Continue on error to allow summary script to run (job failure still occurs due to --error flag)
        continue-on-error: true

      # Always run summary even if semgrep finds issues; uses if: always() to capture results
      - name: Semgrep Summary
        if: always()
        run: bash .github/scripts/semgrep-summary.sh

      # Upload Semgrep report for detailed analysis
      - name: Upload Semgrep Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-semgrep
          path: reports/semgrep.json
          retention-days: 30

  trivy:
    name: Security - Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Clone repository for comprehensive security scan
      - uses: actions/checkout@v7

      # Use official Trivy action for maintained setup + built-in cache handling.
      # Generate JSON report for structured analysis
      - name: Run Trivy scan (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
          format: "json"
          output: "reports/trivy.json"
        # Continue on error to allow summary script to run (job failure still occurs due to exit-code: "1")
        continue-on-error: true

      # Always run summary even if Trivy finds issues; uses if: always() to capture results
      - name: Trivy Summary
        if: always()
        run: bash .github/scripts/trivy-summary.sh

      # Upload Trivy report for detailed analysis
      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-trivy
          path: reports/trivy.json
          retention-days: 30
