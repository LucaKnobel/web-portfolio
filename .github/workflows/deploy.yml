name: Deploy to Infomaniak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: 22

jobs:
  deploy:
    name: Build & Deploy (Native)
    runs-on: ubuntu-latest

    steps:
      # --- 1. Code holen ---
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --- 2. Node Umgebung vorbereiten ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # --- 3. Abhängigkeiten installieren & Build ---
      - name: Install & Build (SSR)
        run: |
          npm ci
          npm run typecheck
          npm run build

      # --- 4. Build prüfen ---
      - name: Validate Build Output
        run: |
          if [ ! -f "dist/server/entry.mjs" ]; then
            echo "❌ SSR entry point missing"
            exit 1
          fi
          if [ ! -d "dist/client" ]; then
            echo "❌ Client assets missing"
            exit 1
          fi
          echo "✅ Build validation successful"

      # --- 5. Nur Produktions-Abhängigkeiten behalten ---
      - name: Prepare Production Dependencies
        run: |
          npm prune --production
          [ -d node_modules ] || { echo "❌ node_modules missing"; exit 1; }

      # --- 6. Release-Paket erstellen ---
      - name: Create Release Package
        run: |
          RELEASE_ID="${{ github.run_id }}_$(echo '${{ github.sha }}' | cut -c1-8)"
          echo "RELEASE_ID=${RELEASE_ID}" >> $GITHUB_ENV

          mkdir -p release-package
          cp -r dist node_modules package.json release-package/

          echo "# Release Manifest" > release-package/RELEASE_INFO
          echo "Release ID: $RELEASE_ID" >> release-package/RELEASE_INFO
          echo "Git SHA: ${{ github.sha }}" >> release-package/RELEASE_INFO
          echo "Build Date: $(date -Iseconds)" >> release-package/RELEASE_INFO
          echo "Node Version: ${{ env.NODE_VERSION }}" >> release-package/RELEASE_INFO

          echo "✅ Release package prepared (${RELEASE_ID})"

      # --- 7. lftp installieren ---
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # --- 8. SFTP-Upload + Switch + Restart (ein einziger Block) ---
      - name: Upload and Switch via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          REMOTE_BASE: ${{ secrets.REMOTE_BASE }}
        run: |
              # Navigiere ins App-Verzeichnis (ab Login-Root!)
              cd sites/lucaknobel.ch/app || { echo "❌ base path missing"; bye; }

              # 1) sicherstellen, dass releases/ existiert
              mkdir releases || true
              cd releases

              # 2) neues Release-Verzeichnis anlegen
              mkdir $RELEASE_ID
              cd $RELEASE_ID

              # 3) Dateien hochladen (aus dem GitHub Runner)
              mirror -R --delete --parallel=4 ../../release-package .

              # 4) zurück ins App-Verzeichnis
              cd ../..

              # 5) Switch + Restart
              mv current current_old || true
              mv releases/$RELEASE_ID current

              mkdir -p current/tmp
              put -O current/tmp /dev/null -o restart.txt

              bye

      # --- 9. Deployment-Validierung ---
      - name: Verify Deployment
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          REMOTE_BASE: ${{ secrets.REMOTE_BASE }}
        run: |
          set -euo pipefail
          echo "🔍 Checking deployment ..."
          lftp -u "$SFTP_USER","$SFTP_PASS" sftp://$SFTP_HOST <<EOF
          set sftp:auto-confirm yes
          cd $REMOTE_BASE
          echo "Active target:"
          ls -l current
          echo "Releases on server:"
          ls -l releases
          bye
          EOF
          echo "✅ Deployment verification finished"

      # --- 10. Abschluss ---
      - name: Done
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Release ID: $RELEASE_ID"
          echo "URL: https://lucaknobel.ch"
