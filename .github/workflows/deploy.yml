name: Deploy to Infomaniak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: 22

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1) Code holen
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2) Node vorbereiten
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 3) Install + Build (SSR)
      - name: Install & Build
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run build

      # 4) Build verifizieren
      - name: Validate Build
        run: |
          set -euo pipefail
          [ -f "dist/server/entry.mjs" ] || { echo "❌ SSR entry missing: dist/server/entry.mjs"; exit 1; }
          [ -d "dist/client" ] || { echo "❌ Client assets missing: dist/client"; exit 1; }
          echo "✅ Build OK"

      # 5) Minimal-Paket erstellen (dist + package.json + lockfile)
      - name: Create Minimal Release Package
        run: |
          set -euo pipefail
          TS=$(date '+%Y%m%d-%H%M%S')
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-8)
          RELEASE_ID="${TS}_${{ github.run_id }}_${SHORT_SHA}"
          echo "RELEASE_ID=${RELEASE_ID}" >> $GITHUB_ENV

          mkdir -p release-package
          cp -r dist release-package/
          cp package.json package-lock.json release-package/ || true

          {
            echo "# Release Manifest"
            echo "Release ID: ${RELEASE_ID}"
            echo "Git SHA: ${{ github.sha }}"
            echo "Build Date: $(date -Iseconds)"
            echo "Node Version: ${{ env.NODE_VERSION }}"
            echo "Method: SSH + rsync, server-side npm ci --omit=dev"
          } > release-package/RELEASE_INFO

      # 6) Tools für SSH/rsync
      - name: Install SSH Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      # 7) Secrets + SSH-Basisprüfung (ohne sensible Daten zu leaken)
      - name: Debug Secrets & Connectivity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          set -euo pipefail
          [ -n "${SSH_HOST:-}" ] || { echo "❌ SSH_HOST secret fehlt"; exit 1; }
          [ -n "${SSH_USER:-}" ] || { echo "❌ SSH_USER secret fehlt"; exit 1; }
          [ -n "${SSH_PASS:-}" ] || { echo "❌ SSH_PASS secret fehlt"; exit 1; }

          # Port 22 erreichbar?
          timeout 5 bash -lc "</dev/tcp/$SSH_HOST/22" && echo "✅ Port 22 erreichbar" || { echo "❌ SSH-Port nicht erreichbar"; exit 1; }

          # Auth Test (mit -tt für pseudo-tty, manche Umgebungen verlangen das)
          if sshpass -p "$SSH_PASS" ssh -tt -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
               -o PreferredAuthentications=password -o PubkeyAuthentication=no \
               "$SSH_USER@$SSH_HOST" "echo OK"; then
            echo "✅ SSH Login ok"
          else
            echo "❌ SSH Login fehlgeschlagen"
            exit 1
          fi

      # 8) Upload + Server-Deploy (ohne Fremd-Actions)
      - name: Upload & Server Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          REMOTE_BASE: ${{ secrets.REMOTE_BASE }}
        run: |
          set -euo pipefail
          echo "🌍 Target: $SSH_USER@$SSH_HOST"
          echo "📂 Remote base: $REMOTE_BASE"
          echo "🏷️ Release: $RELEASE_ID"

          # a) Release-Verzeichnis anlegen
          sshpass -p "$SSH_PASS" ssh -tt -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$REMOTE_BASE/releases/$RELEASE_ID'"

          # b) rsync Upload
          sshpass -p "$SSH_PASS" rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./release-package/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_BASE/releases/$RELEASE_ID/"

          # c) Server-Script: npm ci (prod), Symlink-Switch, Restart-Trigger
          sshpass -p "$SSH_PASS" ssh -tt -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "export BASE='$REMOTE_BASE' REL='$REMOTE_BASE/releases/$RELEASE_ID' CUR='$REMOTE_BASE/current'; bash -s" <<'EOS'
          set -euxo pipefail

          echo "🔎 Preflight"
          test -d "$BASE"
          test -d "$REL"
          test -f "$REL/dist/server/entry.mjs"
          test -f "$REL/package.json"

          echo "📦 npm ci --omit=dev"
          cd "$REL"
          # Node/NPM vorhanden?
          command -v node
          command -v npm
          npm ci --omit=dev --no-audit --no-fund
          test -d node_modules

          echo "🔁 Atomic switch via symlink"
          # Alle Releases bleiben erhalten; current zeigt nur um.
          ln -sfn "$REL" "$CUR"
          # Verifizieren, dass current auf dieses Release zeigt
          if [ -L "$CUR" ]; then
            TARGET=$(readlink "$CUR")
            echo "current -> $TARGET"
          fi
          test -f "$CUR/dist/server/entry.mjs"

          echo "🌀 Restart trigger"
          mkdir -p "$CUR/tmp"
          date > "$CUR/tmp/restart.txt"
          test -f "$CUR/tmp/restart.txt"

          echo "✅ Server deploy done"
          EOS

      # 9) Abschluss-Checks (lesen, nicht starten)
      - name: Post-Deploy Verification
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          REMOTE_BASE: ${{ secrets.REMOTE_BASE }}
        run: |
          set -euo pipefail
          sshpass -p "$SSH_PASS" ssh -tt -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "BASE='$REMOTE_BASE'; CUR='$REMOTE_BASE/current'; \
             echo '🔎 current:'; ls -l \"\$CUR\"; \
             echo '🔎 key files:'; ls -l \"\$CUR/dist/server/entry.mjs\" \"\$CUR/package.json\"; \
             echo '🔎 restart:'; ls -l \"\$CUR/tmp/restart.txt\" || true; \
             echo '🔎 releases:'; ls -1 \"\$BASE/releases\" | tail -n 10"

      - name: Done
        run: |
          echo "🎉 Deployment abgeschlossen"
          echo "Release: $RELEASE_ID"
