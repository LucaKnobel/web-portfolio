name: Deploy to Infomaniak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: 22

jobs:
  deploy:
    name: Build & Deploy (Native)
    runs-on: ubuntu-latest

    steps:
      # --- 1. Get source code ---
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Debug - Repository Info
        run: |
          echo "🔍 Repository checkout completed"
          echo "Working directory: $(pwd)"
          echo "Git commit: ${{ github.sha }}"
          echo "Git ref: ${{ github.ref }}"
          echo "Files in root:"
          ls -la
          
      # --- 2. Prepare Node environment ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Debug - Node Environment
        run: |
          echo "🔍 Node.js environment setup completed"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "NPM cache location: $(npm config get cache)"
          
      # --- 3. Install dependencies & build ---
      - name: Install & Build (SSR)
        run: |
          echo "🔍 Starting dependency installation..."
          npm ci
          echo "✅ Dependencies installed"
          
          echo "🔍 Running TypeScript type check..."
          npm run typecheck
          echo "✅ Type check completed"
          
          echo "🔍 Starting production build..."
          npm run build
          echo "✅ Build completed"

      - name: Debug - Build Process
        run: |
          echo "🔍 Build process completed, checking output..."
          echo "Dist directory contents:"
          ls -la dist/
          echo "Server directory contents:"
          ls -la dist/server/ || echo "No server directory"
          echo "Client directory contents:"
          ls -la dist/client/ || echo "No client directory"
          
      # --- 4. Validate build output ---
      - name: Validate Build Output
        run: |
          echo "🔍 Validating build output..."
          
          echo "Checking SSR entry point..."
          if [ ! -f "dist/server/entry.mjs" ]; then
            echo "❌ SSR entry point missing: dist/server/entry.mjs"
            exit 1
          fi
          echo "✅ SSR entry point found: dist/server/entry.mjs"
          
          echo "Checking client assets..."
          if [ ! -d "dist/client" ]; then
            echo "❌ Client assets missing: dist/client"
            exit 1
          fi
          echo "✅ Client assets found: dist/client"
          
          echo "✅ Build validation successful"

      - name: Debug - Build Validation
        run: |
          echo "🔍 Build validation completed, showing file sizes..."
          echo "SSR entry point size:"
          ls -lh dist/server/entry.mjs
          echo "Client assets overview:"
          du -sh dist/client/*
          echo "Total dist size:"
          du -sh dist/
          
      # --- 5. Keep only production dependencies ---
      - name: Prepare Production Dependencies
        run: |
          echo "🔍 Preparing production dependencies..."
          echo "Before pruning - node_modules size:"
          du -sh node_modules/
          
          npm prune --production
          echo "✅ Development dependencies removed"
          
          echo "After pruning - node_modules size:"
          du -sh node_modules/
          
          [ -d node_modules ] || { echo "❌ node_modules missing after prune"; exit 1; }
          echo "✅ Production dependencies ready"

      - name: Debug - Dependencies
        run: |
          echo "🔍 Production dependencies overview..."
          echo "Number of packages:"
          ls node_modules/ | wc -l
          echo "Top 10 largest packages:"
          du -sh node_modules/* | sort -hr | head -10
          
      # --- 6. Create release package ---
      - name: Create Release Package
        run: |
          echo "🔍 Creating release package..."
          
          RELEASE_ID="${{ github.run_id }}_$(echo '${{ github.sha }}' | cut -c1-8)"
          echo "Generated Release ID: ${RELEASE_ID}"
          echo "RELEASE_ID=${RELEASE_ID}" >> $GITHUB_ENV

          echo "Creating release-package directory..."
          mkdir -p release-package
          
          echo "Copying dist directory..."
          cp -r dist release-package/
          echo "✅ Dist copied"
          
          echo "Copying node_modules..."
          cp -r node_modules release-package/
          echo "✅ Node modules copied"
          
          echo "Copying package.json..."
          cp package.json release-package/
          echo "✅ Package.json copied"

          echo "Creating release manifest..."
          echo "# Release Manifest" > release-package/RELEASE_INFO
          echo "Release ID: $RELEASE_ID" >> release-package/RELEASE_INFO
          echo "Git SHA: ${{ github.sha }}" >> release-package/RELEASE_INFO
          echo "Build Date: $(date -Iseconds)" >> release-package/RELEASE_INFO
          echo "Node Version: ${{ env.NODE_VERSION }}" >> release-package/RELEASE_INFO
          echo "✅ Release manifest created"

          echo "✅ Release package prepared (${RELEASE_ID})"

      - name: Debug - Release Package
        run: |
          echo "🔍 Release package overview..."
          echo "Release ID: $RELEASE_ID"
          echo "Package contents:"
          ls -la release-package/
          echo "Package size breakdown:"
          du -sh release-package/*
          echo "Total package size:"
          du -sh release-package/
          echo "Release info file:"
          cat release-package/RELEASE_INFO
          
      # --- 7. Install lftp ---
      - name: Install lftp
        run: |
          echo "🔍 Installing lftp..."
          sudo apt-get update
          sudo apt-get install -y lftp
          echo "✅ lftp installed"

      - name: Debug - LFTP Installation
        run: |
          echo "🔍 LFTP installation verification..."
          lftp --version
          echo "✅ LFTP ready for use"
          
      # --- 8. SFTP upload + switch + restart (single atomic block) ---
      - name: Upload and Switch via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          REMOTE_BASE: ${{ secrets.REMOTE_BASE }}
        run: |
          set -euo pipefail
          # Lokalen Paketpfad ABSOLUT setzen (für lftp lcd)
          LOCAL_PACKAGE_DIR="$(pwd)/release-package"
          echo "LOCAL_PACKAGE_DIR=$LOCAL_PACKAGE_DIR"

          echo "🚀 Connect to $SFTP_HOST via SFTP"
          lftp -u "$SFTP_USER","$SFTP_PASS" sftp://$SFTP_HOST <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 30
          set cmd:trace on

          # 0) Logging: lokale & remote Positionen
          lcd $LOCAL_PACKAGE_DIR
          !echo "LOCAL (lcd):"
          !pwd
          !ls -la

          cd $REMOTE_BASE
          echo "REMOTE (cd $REMOTE_BASE):"
          pwd
          cls -la

          # 1) releases/ sicherstellen + in neues Release gehen
          mkdir releases || true
          cd releases
          mkdir $RELEASE_ID
          cd $RELEASE_ID
          echo "REMOTE (release dir):"
          pwd
          cls -la

          # 2) Upload (von lokalem lcd '.' ins aktuelle Remote '.')
          echo "Start mirror upload..."
          mirror -R --parallel=4 . .
          echo "Upload done. Check:"
          cls -la

          # 3) Zurück zum App-Root, Switch & Restart
          cd ../..
          echo "REMOTE (app root after upload):"
          pwd
          cls -la

          mv current current_old || true
          mv releases/$RELEASE_ID current

          mkdir -p current/tmp
          put -O current/tmp /dev/null -o restart.txt

          echo "Final state (current):"
          cls -la current
          bye
          EOF

          echo "✅ SFTP deployment completed."
      - name: Verify Deployment
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          REMOTE_BASE: ${{ secrets.REMOTE_BASE }}
        run: |
          set -euo pipefail
          lftp -u "$SFTP_USER","$SFTP_PASS" sftp://$SFTP_HOST <<EOF
          set sftp:auto-confirm yes
          set cmd:trace on
          cd $REMOTE_BASE
          echo "REMOTE base:"
          pwd
          echo "current listing:"
          cls -la current
          echo "releases listing:"
          cls -la releases
          echo "release info (should exist):"
          cat current/RELEASE_INFO || echo "⚠️ RELEASE_INFO missing"
          echo "SSR entry:"
          cls -la current/dist/server/entry.mjs || echo "❌ SSR entry missing"
          echo "restart.txt:"
          cls -la current/tmp/restart.txt || echo "⚠️ restart.txt missing"
          bye
          EOF

      # --- 10. Deployment completion ---
      - name: Deployment Complete
        run: |
              echo "🎉 Deployment completed successfully!"
              echo "📋 Deployment Summary:"
              echo "   Release ID: $RELEASE_ID"
              echo "   Git SHA: ${{ github.sha }}"
              echo "   Build Date: $(date -Iseconds)"
              echo "   Node Version: ${{ env.NODE_VERSION }}"
              echo "   Target Host: ${{ secrets.SFTP_HOST }}"
              echo "🌐 Live URL: https://lucaknobel.ch"
              echo "✅ All deployment steps completed successfully"
