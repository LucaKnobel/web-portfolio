name: Deploy to Infomaniak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: 22

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # --- 1. Get source code ---
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Debug - Repository Info
        run: |
          echo "🔍 Repository checkout completed"
          echo "Working directory: $(pwd)"
          echo "Git commit: ${{ github.sha }}"
          echo "Git ref: ${{ github.ref }}"
          echo "Files in root:"
          ls -la
          
      # --- 2. Prepare Node environment ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Debug - Node Environment
        run: |
          echo "🔍 Node.js environment setup completed"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "NPM cache location: $(npm config get cache)"
          
      # --- 3. Install dependencies & build ---
      - name: Install & Build (SSR)
        run: |
          echo "🔍 Starting dependency installation..."
          npm ci
          echo "✅ Dependencies installed"
          
          echo "🔍 Running TypeScript type check..."
          npm run typecheck
          echo "✅ Type check completed"
          
          echo "🔍 Starting production build..."
          npm run build
          echo "✅ Build completed"

      - name: Debug - Build Process
        run: |
          echo "🔍 Build process completed, checking output..."
          echo "Dist directory contents:"
          ls -la dist/
          echo "Server directory contents:"
          ls -la dist/server/ || echo "No server directory"
          echo "Client directory contents:"
          ls -la dist/client/ || echo "No client directory"
          
      # --- 4. Validate build output ---
      - name: Validate Build Output
        run: |
          echo "🔍 Validating build output..."
          
          echo "Checking SSR entry point..."
          if [ ! -f "dist/server/entry.mjs" ]; then
            echo "❌ SSR entry point missing: dist/server/entry.mjs"
            exit 1
          fi
          echo "✅ SSR entry point found: dist/server/entry.mjs"
          
          echo "Checking client assets..."
          if [ ! -d "dist/client" ]; then
            echo "❌ Client assets missing: dist/client"
            exit 1
          fi
          echo "✅ Client assets found: dist/client"
          
          echo "✅ Build validation successful"

      - name: Debug - Build Validation
        run: |
          echo "🔍 Build validation completed, showing file sizes..."
          echo "SSR entry point size:"
          ls -lh dist/server/entry.mjs
          echo "Client assets overview:"
          du -sh dist/client/*
          echo "Total dist size:"
          du -sh dist/
          
      # --- 5. Keep only production dependencies ---
      - name: Prepare Production Dependencies
        run: |
          echo "🔍 Preparing production dependencies..."
          echo "Before pruning - node_modules size:"
          du -sh node_modules/
          
          npm prune --production
          echo "✅ Development dependencies removed"
          
          echo "After pruning - node_modules size:"
          du -sh node_modules/
          
          [ -d node_modules ] || { echo "❌ node_modules missing after prune"; exit 1; }
          echo "✅ Production dependencies ready"

      - name: Debug - Dependencies
        run: |
          echo "🔍 Production dependencies overview..."
          echo "Number of packages:"
          ls node_modules/ | wc -l
          echo "Top 10 largest packages:"
          du -sh node_modules/* | sort -hr | head -10
          
      # --- 6. Create minimal release package (dist + package.json only) ---
      - name: Create Minimal Release Package
        run: |
          echo "🔍 Creating minimal release package for SSH deployment..."
          
          # Generate human-readable timestamp
          TIMESTAMP=$(date '+%Y%m%d-%H%M%S')
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-8)
          RELEASE_ID="${TIMESTAMP}_${{ github.run_id }}_${SHORT_SHA}"
          
          echo "🔍 Release ID components:"
          echo "   Timestamp: $TIMESTAMP ($(date '+%Y-%m-%d %H:%M:%S'))"
          echo "   Run ID: ${{ github.run_id }}"
          echo "   Short SHA: $SHORT_SHA"
          echo "Generated Release ID: ${RELEASE_ID}"
          echo "RELEASE_ID=${RELEASE_ID}" >> $GITHUB_ENV

          echo "🔍 Creating minimal release-package directory..."
          mkdir -p release-package
          
          echo "🔍 Copying dist directory (SSR build output)..."
          cp -r dist release-package/
          echo "✅ Dist directory copied ($(du -sh dist/ | cut -f1))"
          
          echo "🔍 Copying package.json (for npm ci on server)..."
          cp package.json release-package/
          echo "✅ Package.json copied"
          
          echo "🔍 Copying package-lock.json (for exact dependency resolution)..."
          cp package-lock.json release-package/
          echo "✅ Package-lock.json copied"

          echo "🔍 Creating release manifest..."
          echo "# Release Manifest" > release-package/RELEASE_INFO
          echo "Release ID: $RELEASE_ID" >> release-package/RELEASE_INFO
          echo "Human-readable: $(date '+%Y-%m-%d %H:%M:%S UTC') (Run: ${{ github.run_id }})" >> release-package/RELEASE_INFO
          echo "Git SHA: ${{ github.sha }}" >> release-package/RELEASE_INFO
          echo "Build Date: $(date -Iseconds)" >> release-package/RELEASE_INFO
          echo "Node Version: ${{ env.NODE_VERSION }}" >> release-package/RELEASE_INFO
          echo "Deployment Method: SSH-only (no node_modules upload)" >> release-package/RELEASE_INFO
          echo "✅ Release manifest created"

          echo "✅ Minimal release package prepared (${RELEASE_ID})"
          echo "📦 Total package size: $(du -sh release-package/ | cut -f1) (no node_modules!)"

      - name: Debug - Minimal Release Package
        run: |
          echo "🔍 Minimal release package overview..."
          echo "Release ID: $RELEASE_ID"
          echo "📦 Package contents:"
          ls -la release-package/
          echo "📊 Package size breakdown:"
          du -sh release-package/*
          echo "📈 Total package size (should be small without node_modules):"
          du -sh release-package/
          echo "📋 Release info file:"
          cat release-package/RELEASE_INFO
          echo "🔍 Dist structure check:"
          find release-package/dist -name "*.mjs" -o -name "*.js" | head -10
          echo "✅ Minimal package ready for fast SSH upload"
          
      # --- 7. Install SSH tools (sshpass for password auth) ---
      - name: Install SSH Tools
        run: |
          echo "🔍 Installing SSH tools for password authentication..."
          sudo apt-get update
          sudo apt-get install -y sshpass rsync
          echo "✅ SSH tools installed"

      - name: Debug - SSH Tools Installation
        run: |
          echo "🔍 SSH tools installation verification..."
          sshpass -V
          rsync --version | head -5
          echo "✅ SSH tools ready for deployment"

      # Ersetze Step 8 mit diesen Debug-Steps:

      # Ersetze Step 8a mit detailliertem Debug:

      # --- 8a. SSH Credentials Debug ---
      - name: Debug - SSH Credentials and Connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          echo "🔍 SSH Connection Debug - Security-First Analysis"
          
          # Validate secrets are not empty (without exposing them)
          echo "🔍 Validating GitHub Secrets..."
          [ -n "$SSH_HOST" ] && echo "✅ SSH_HOST: Set (length: ${#SSH_HOST})" || echo "❌ SSH_HOST: Empty"
          [ -n "$SSH_USER" ] && echo "✅ SSH_USER: Set (length: ${#SSH_USER})" || echo "❌ SSH_USER: Empty"
          [ -n "$SSH_PASS" ] && echo "✅ SSH_PASS: Set (length: ${#SSH_PASS})" || echo "❌ SSH_PASS: Empty"
          
          # Check for common issues
          echo "🔍 SSH_HOST format check..."
          if [[ "$SSH_HOST" =~ ^ssh-.+\.infomaniak\.com$ ]]; then
            echo "✅ SSH_HOST appears to be valid Infomaniak format"
          else
            echo "⚠️  SSH_HOST format unusual (expected: ssh-xxxxx.infomaniak.com)"
          fi
          
          # Test network connectivity first
          echo "🔍 Testing network connectivity to $SSH_HOST..."
          if ping -c 1 -W 5 "$SSH_HOST" >/dev/null 2>&1; then
            echo "✅ Host is reachable via ping"
          else
            echo "⚠️  Host not responding to ping (may be normal for SSH servers)"
          fi
          
          # Test SSH port connectivity
          echo "🔍 Testing SSH port connectivity..."
          if timeout 10 bash -c "</dev/tcp/$SSH_HOST/22" 2>/dev/null; then
            echo "✅ SSH port 22 is open"
          else
            echo "❌ SSH port 22 is not accessible"
            echo "   → Check if SSH_HOST is correct"
            echo "   → Check if Infomaniak SSH is enabled"
            exit 1
          fi
          
          # Test SSH with verbose output (but hide password)
          echo "🔍 Testing SSH authentication..."
          if sshpass -p "$SSH_PASS" ssh -v -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            "$SSH_USER@$SSH_HOST" "echo 'SSH_AUTH_SUCCESS'" 2>&1 | \
            grep -q "SSH_AUTH_SUCCESS"; then
            echo "✅ SSH authentication successful"
          else
            echo "❌ SSH authentication failed"
            echo "   → Check SSH_USER and SSH_PASS in GitHub Secrets"
            echo "   → Verify credentials with Infomaniak control panel"
            echo "   → Ensure SSH access is enabled for your hosting account"
            exit 1
          fi
          
          echo "✅ SSH connection and authentication verified"

      # Ersetze Step 8b mit TTY-freier Alternative:

      # --- 8b. SSH without TTY (Infomaniak Compatible) ---  
      - name: Debug - SSH without TTY (Infomaniak Compatible)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          echo "🔍 Testing SSH without TTY (Infomaniak shared hosting compatible)..."
          
          # Test basic SSH without TTY
          echo "🔍 Method 1: Basic SSH (no TTY)..."
          if sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "echo 'Basic SSH works'; whoami; pwd"; then
            echo "✅ Basic SSH (no TTY) works"
          else
            echo "❌ Basic SSH failed"; exit 1;
          fi
          
          # Test explicit bash invocation
          echo "🔍 Method 2: Explicit bash shell..."
          if sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "bash -c 'echo Explicit bash works; echo HOME=\$HOME'"; then
            echo "✅ Explicit bash works"
          else
            echo "❌ Explicit bash failed"; exit 1;
          fi
          
          # Test login shell simulation
          echo "🔍 Method 3: Login shell simulation..."
          if sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "bash --login -c 'echo Login shell simulation works; echo PATH=\$PATH'"; then
            echo "✅ Login shell simulation works"
          else
            echo "❌ Login shell simulation failed"; exit 1;
          fi
          
          echo "✅ SSH without TTY methods verified"

      # --- 8c. Node.js Environment Test (TTY-free) ---
      - name: Debug - Node.js Environment (TTY-free)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          echo "🔍 Testing Node.js environment without TTY..."
          
          # Test Node.js with different shell invocations
          echo "🔍 Testing Node.js availability..."
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "bash --login -c 'echo Testing Node environment...; which node 2>/dev/null && echo Node found: \$(node -v) || echo Node not in PATH; which npm 2>/dev/null && echo NPM found: \$(npm -v) || echo NPM not in PATH; echo Test completed'" || {
            echo "❌ Node.js environment test failed"; exit 1;
          }
          echo "✅ Node.js environment test completed"

      # --- 8d. Directory Operations Test (TTY-free) ---
      - name: Debug - Directory Operations (TTY-free)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          REMOTE_BASE: ${{ secrets.REMOTE_BASE }}
        run: |
          echo "🔍 Testing directory operations without TTY..."
          echo "Remote base: $REMOTE_BASE"
          
          # Test directory operations without TTY
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "bash -c 'echo Directory test starting; test -d \"$REMOTE_BASE\" && echo Base exists: $REMOTE_BASE || echo Base missing: $REMOTE_BASE; mkdir -p \"$REMOTE_BASE/test_$RELEASE_ID\" && echo Test dir created; ls -la \"$REMOTE_BASE/\" | grep test_ || true; rmdir \"$REMOTE_BASE/test_$RELEASE_ID\" && echo Test dir removed; echo Directory test completed'" || {
            echo "❌ Directory operations failed"; exit 1;
          }
          echo "✅ Directory operations work without TTY"

      # --- 8e. Upload Test (TTY-free) ---
      - name: Debug - Small Upload Test (TTY-free)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          REMOTE_BASE: ${{ secrets.REMOTE_BASE }}
        run: |
          echo "🔍 Testing file upload without TTY..."
          
          # Create test file
          echo "Test upload at $(date) - TTY-free deployment" > test_upload.txt
          
          # Create release directory without TTY
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "bash -c 'mkdir -p \"$REMOTE_BASE/releases/$RELEASE_ID\" && echo Directory created: $REMOTE_BASE/releases/$RELEASE_ID'" || {
            echo "❌ Release directory creation failed"; exit 1;
          }
          
          # Test rsync upload (rsync doesn't need TTY)
          sshpass -p "$SSH_PASS" rsync -av \
            -e "ssh -o StrictHostKeyChecking=no" \
            test_upload.txt \
            "$SSH_USER@$SSH_HOST:$REMOTE_BASE/releases/$RELEASE_ID/" || {
            echo "❌ Test upload failed"; exit 1;
          }
          
          # Verify upload without TTY
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "bash -c 'test -f \"$REMOTE_BASE/releases/$RELEASE_ID/test_upload.txt\" && echo Upload verified: test file exists || echo Upload missing'" || {
            echo "❌ Upload verification failed"; exit 1;
          }
          
          echo "✅ Upload test successful without TTY"

      # --- 8f. Full Upload (TTY-free) ---
      - name: Debug - Full Release Upload (TTY-free)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          REMOTE_BASE: ${{ secrets.REMOTE_BASE }}
        run: |
          echo "🔍 Uploading full release package without TTY..."
          
          # Upload release package (rsync works without TTY)
          sshpass -p "$SSH_PASS" rsync -avz --progress \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./release-package/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_BASE/releases/$RELEASE_ID/" || {
            echo "❌ Full upload failed"; exit 1;
          }
          
          echo "✅ Full upload completed without TTY"

      # --- 8g. Deployment Operations (TTY-free) ---
      - name: Debug - Deployment Operations (TTY-free)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          REMOTE_BASE: ${{ secrets.REMOTE_BASE }}
        run: |
          echo "🔍 Running deployment operations without TTY..."
          
          # TTY-free deployment using standard SSH
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "bash --login -c '
            # Error handling
            set -euo pipefail
            
            # Set variables
            BASE=\"$REMOTE_BASE\"
            REL=\"\$BASE/releases/$RELEASE_ID\"
            CUR=\"\$BASE/current\"
            
            echo \"🔍 Deployment variables:\"
            echo \"   BASE: \$BASE\"
            echo \"   REL: \$REL\"
            echo \"   CUR: \$CUR\"
            
            # Verify upload
            echo \"🔍 Verifying upload...\"
            test -d \"\$REL\" || { echo \"❌ Release dir missing: \$REL\"; exit 1; }
            test -f \"\$REL/package.json\" || { echo \"❌ package.json missing\"; exit 1; }
            test -f \"\$REL/dist/server/entry.mjs\" || { echo \"❌ SSR entry missing\"; exit 1; }
            echo \"✅ Files verified\"
            
            # Install dependencies
            echo \"🔍 Installing dependencies...\"
            cd \"\$REL\"
            npm ci --omit=dev --no-audit --no-fund || { echo \"❌ npm ci failed\"; exit 1; }
            echo \"✅ Dependencies installed: \$(ls node_modules/ | wc -l) packages\"
            
            # Deployment switch
            echo \"🔍 Performing deployment switch...\"
            cd \"\$BASE\"
            if [ -e \"\$CUR\" ]; then
              mv \"\$CUR\" \"current_backup_\$(date +%s)\" 2>/dev/null || true
              echo \"✅ Previous version backed up\"
            fi
            mv \"\$REL\" \"\$CUR\" || { echo \"❌ Switch failed\"; exit 1; }
            echo \"✅ New release activated\"
            
            # Passenger restart trigger
            echo \"🔍 Triggering restart...\"
            mkdir -p \"\$CUR/tmp\"
            date > \"\$CUR/tmp/restart.txt\"
            echo \"✅ Restart triggered: \$(date)\"
            
            echo \"🎉 TTY-free deployment completed successfully!\"
            '" || {
            echo "❌ Deployment operations failed"; exit 1;
          }
          
          echo "🎉 TTY-free deployment operations completed!"