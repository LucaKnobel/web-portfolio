name: Deploy to Infomaniak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: 22

jobs:
  deploy:
    name: Build & Deploy (Native)
    runs-on: ubuntu-latest

    steps:
      # --- 1. Get source code ---
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Debug - Repository Info
        run: |
          echo "🔍 Repository checkout completed"
          echo "Working directory: $(pwd)"
          echo "Git commit: ${{ github.sha }}"
          echo "Git ref: ${{ github.ref }}"
          echo "Files in root:"
          ls -la
          
      # --- 2. Prepare Node environment ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Debug - Node Environment
        run: |
          echo "🔍 Node.js environment setup completed"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "NPM cache location: $(npm config get cache)"
          
      # --- 3. Install dependencies & build ---
      - name: Install & Build (SSR)
        run: |
          echo "🔍 Starting dependency installation..."
          npm ci
          echo "✅ Dependencies installed"
          
          echo "🔍 Running TypeScript type check..."
          npm run typecheck
          echo "✅ Type check completed"
          
          echo "🔍 Starting production build..."
          npm run build
          echo "✅ Build completed"

      - name: Debug - Build Process
        run: |
          echo "🔍 Build process completed, checking output..."
          echo "Dist directory contents:"
          ls -la dist/
          echo "Server directory contents:"
          ls -la dist/server/ || echo "No server directory"
          echo "Client directory contents:"
          ls -la dist/client/ || echo "No client directory"
          
      # --- 4. Validate build output ---
      - name: Validate Build Output
        run: |
          echo "🔍 Validating build output..."
          
          echo "Checking SSR entry point..."
          if [ ! -f "dist/server/entry.mjs" ]; then
            echo "❌ SSR entry point missing: dist/server/entry.mjs"
            exit 1
          fi
          echo "✅ SSR entry point found: dist/server/entry.mjs"
          
          echo "Checking client assets..."
          if [ ! -d "dist/client" ]; then
            echo "❌ Client assets missing: dist/client"
            exit 1
          fi
          echo "✅ Client assets found: dist/client"
          
          echo "✅ Build validation successful"

      - name: Debug - Build Validation
        run: |
          echo "🔍 Build validation completed, showing file sizes..."
          echo "SSR entry point size:"
          ls -lh dist/server/entry.mjs
          echo "Client assets overview:"
          du -sh dist/client/*
          echo "Total dist size:"
          du -sh dist/
          
      # --- 5. Keep only production dependencies ---
      - name: Prepare Production Dependencies
        run: |
          echo "🔍 Preparing production dependencies..."
          echo "Before pruning - node_modules size:"
          du -sh node_modules/
          
          npm prune --production
          echo "✅ Development dependencies removed"
          
          echo "After pruning - node_modules size:"
          du -sh node_modules/
          
          [ -d node_modules ] || { echo "❌ node_modules missing after prune"; exit 1; }
          echo "✅ Production dependencies ready"

      - name: Debug - Dependencies
        run: |
          echo "🔍 Production dependencies overview..."
          echo "Number of packages:"
          ls node_modules/ | wc -l
          echo "Top 10 largest packages:"
          du -sh node_modules/* | sort -hr | head -10
          
      # --- 6. Create minimal release package (dist + package.json only) ---
      - name: Create Minimal Release Package
        run: |
          echo "🔍 Creating minimal release package for SSH deployment..."
          
          RELEASE_ID="${{ github.run_id }}_$(echo '${{ github.sha }}' | cut -c1-8)"
          echo "Generated Release ID: ${RELEASE_ID}"
          echo "RELEASE_ID=${RELEASE_ID}" >> $GITHUB_ENV

          echo "🔍 Creating minimal release-package directory..."
          mkdir -p release-package
          
          echo "🔍 Copying dist directory (SSR build output)..."
          cp -r dist release-package/
          echo "✅ Dist directory copied ($(du -sh dist/ | cut -f1))"
          
          echo "🔍 Copying package.json (for npm ci on server)..."
          cp package.json release-package/
          echo "✅ Package.json copied"
          
          echo "🔍 Copying package-lock.json (for exact dependency resolution)..."
          cp package-lock.json release-package/
          echo "✅ Package-lock.json copied"

          echo "🔍 Creating release manifest..."
          echo "# Release Manifest" > release-package/RELEASE_INFO
          echo "Release ID: $RELEASE_ID" >> release-package/RELEASE_INFO
          echo "Git SHA: ${{ github.sha }}" >> release-package/RELEASE_INFO
          echo "Build Date: $(date -Iseconds)" >> release-package/RELEASE_INFO
          echo "Node Version: ${{ env.NODE_VERSION }}" >> release-package/RELEASE_INFO
          echo "Deployment Method: SSH-only (no node_modules upload)" >> release-package/RELEASE_INFO
          echo "✅ Release manifest created"

          echo "✅ Minimal release package prepared (${RELEASE_ID})"
          echo "📦 Total package size: $(du -sh release-package/ | cut -f1) (no node_modules!)"

      - name: Debug - Minimal Release Package
        run: |
          echo "🔍 Minimal release package overview..."
          echo "Release ID: $RELEASE_ID"
          echo "📦 Package contents:"
          ls -la release-package/
          echo "📊 Package size breakdown:"
          du -sh release-package/*
          echo "📈 Total package size (should be small without node_modules):"
          du -sh release-package/
          echo "📋 Release info file:"
          cat release-package/RELEASE_INFO
          echo "🔍 Dist structure check:"
          find release-package/dist -name "*.mjs" -o -name "*.js" | head -10
          echo "✅ Minimal package ready for fast SSH upload"
          
      # --- 7. Install SSH tools (sshpass for password auth) ---
      - name: Install SSH Tools
        run: |
          echo "🔍 Installing SSH tools for password authentication..."
          sudo apt-get update
          sudo apt-get install -y sshpass rsync
          echo "✅ SSH tools installed"

      - name: Debug - SSH Tools Installation
        run: |
          echo "🔍 SSH tools installation verification..."
          sshpass -V
          rsync --version | head -5
          echo "✅ SSH tools ready for deployment"
      # --- 8. SSH-only deployment: Upload minimal package + install deps on server ---
      - name: SSH Deploy - Upload and Switch
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          REMOTE_BASE: ${{ secrets.REMOTE_BASE }}
        run: |
          set -euo pipefail
          echo "🚀 Starting SSH-only deployment process..."
          echo "🔍 Deployment configuration:"
          echo "   Target host: $SSH_HOST"
          echo "   Target user: $SSH_USER"
          echo "   Remote base: $REMOTE_BASE"
          echo "   Release ID: $RELEASE_ID"
          echo "   Deployment method: SSH-only (fast upload + server-side npm install)"
          
          # --- Step 1: Upload minimal package via rsync ---
          echo ""
          echo "📤 Step 1: Uploading minimal package via rsync..."
          echo "🔍 Source: $(pwd)/release-package/"
          echo "🔍 Target: $SSH_USER@$SSH_HOST:$REMOTE_BASE/releases/$RELEASE_ID/"
          
          # Create release directory and upload files
          echo "� Creating remote release directory..."
          sshpass -p "$SSH_PASS" ssh -oStrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "mkdir -p $REMOTE_BASE/releases/$RELEASE_ID"
          echo "✅ Remote release directory created"
          
          echo "🔍 Starting rsync upload (fast, delta-capable)..."
          sshpass -p "$SSH_PASS" rsync -avz --progress --stats \
            -e "ssh -oStrictHostKeyChecking=no" \
            ./release-package/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_BASE/releases/$RELEASE_ID/"
          echo "✅ Rsync upload completed successfully"
          
          # --- Step 2: Verify upload and install production dependencies ---
          echo ""
          echo "🔧 Step 2: Installing production dependencies on server..."
          
          sshpass -p "$SSH_PASS" ssh -oStrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" <<EOF
            REMOTE_BASE="$REMOTE_BASE"
            RELEASE_ID="$RELEASE_ID"
            set -euo pipefail

            echo "🔍 SSH Session: Connected to server"
            echo "🔍 Current working directory: \$(pwd)"
            echo "🔍 Server hostname: \$(hostname)"
            echo "🔍 Server uptime: \$(uptime)"

            # Navigate to app base directory
            echo "🔍 Changing to app base directory..."
            cd "\$REMOTE_BASE"
            echo "✅ Now in: \$(pwd)"
            
            # Verify upload was successful
            echo "🔍 Verifying uploaded release..."
            if [ ! -d "releases/$RELEASE_ID" ]; then
              echo "❌ Release directory not found: releases/$RELEASE_ID"
              exit 1
            fi
            echo "✅ Release directory found: releases/$RELEASE_ID"
            
            echo "🔍 Checking uploaded files..."
            ls -la "releases/$RELEASE_ID/"
            
            echo "🔍 Verifying essential files..."
            if [ ! -f "releases/$RELEASE_ID/dist/server/entry.mjs" ]; then
              echo "❌ SSR entry point missing: releases/$RELEASE_ID/dist/server/entry.mjs"
              exit 1
            fi
            echo "✅ SSR entry point found"
            
            if [ ! -f "releases/$RELEASE_ID/package.json" ]; then
              echo "❌ Package.json missing: releases/$RELEASE_ID/package.json"
              exit 1
            fi
            echo "✅ Package.json found"
            
            # Install production dependencies
            echo "🔍 Installing production dependencies in release directory..."
            cd "releases/$RELEASE_ID"
            echo "🔍 Current directory for npm install: $(pwd)"
            
            echo "🔍 Node.js version on server: $(node --version)"
            echo "🔍 NPM version on server: $(npm --version)"
            
            echo "🔍 Running npm ci --omit=dev (production only)..."
            npm ci --omit=dev --verbose
            echo "✅ Production dependencies installed"
            
            echo "🔍 Verifying node_modules installation..."
            if [ ! -d "node_modules" ]; then
              echo "❌ node_modules directory not created"
              exit 1
            fi
            echo "✅ node_modules directory created"
            echo "📊 node_modules size: $(du -sh node_modules/ | cut -f1)"
            echo "📊 Number of packages: $(ls node_modules/ | wc -l)"
            
            # Go back to app root for switching
            cd ..
            cd ..
            echo "🔍 Back in app root: $(pwd)"
            
            # --- Step 3: Atomic release switch ---
            echo ""
            echo "🔄 Step 3: Performing atomic release switch..."
            
            # Backup current release if it exists
            if [ -e "current" ]; then
              echo "🔍 Backing up current release..."
              if [ -e "current_old" ]; then
                echo "🔍 Removing old backup..."
                rm -rf current_old
              fi
              mv current current_old
              echo "✅ Current release backed up to current_old"
            else
              echo "🔍 No current release to backup (first deployment)"
            fi
            
            # Switch to new release
            echo "🔍 Switching to new release..."
            mv "releases/$RELEASE_ID" current
            echo "✅ New release activated"
            
            # Verify switch was successful
            echo "🔍 Verifying release switch..."
            if [ ! -L "current" ] && [ ! -d "current" ]; then
              echo "❌ Current release not found after switch"
              exit 1
            fi
            
            echo "🔍 Checking current release contents..."
            ls -la current/
            
            echo "🔍 Verifying SSR entry in current release..."
            if [ ! -f "current/dist/server/entry.mjs" ]; then
              echo "❌ SSR entry point missing in current release"
              exit 1
            fi
            echo "✅ SSR entry point verified in current release"
            
            # --- Step 4: Trigger application restart ---
            echo ""
            echo "🔄 Step 4: Triggering application restart..."
            
            echo "🔍 Creating tmp directory for restart trigger..."
            mkdir -p current/tmp
            
            echo "🔍 Creating restart trigger file..."
            touch current/tmp/restart.txt
            echo "✅ Restart trigger created: current/tmp/restart.txt"
            
            echo "🔍 Verifying restart trigger..."
            if [ ! -f "current/tmp/restart.txt" ]; then
              echo "⚠️ Restart trigger file not found"
            else
              echo "✅ Restart trigger file confirmed"
              echo "📅 Restart trigger timestamp: $(stat -c %y current/tmp/restart.txt)"
            fi
            
            # --- Final verification ---
            echo ""
            echo "✅ Deployment Summary:"
            echo "   🆔 Release ID: $RELEASE_ID"
            echo "   📂 Active path: $(pwd)/current"
            echo "   📅 Deployment time: $(date -Iseconds)"
            echo "   🔧 Production deps: Installed on server"
            echo "   📊 Total deployment size: $(du -sh current/ | cut -f1)"
            echo "   🚀 Application: Ready for restart"
            
            echo "🎉 SSH deployment completed successfully!"
          EOF
          
          echo ""
          echo "✅ SSH deployment process completed successfully"
          echo "🔍 Deployment method: SSH-only with server-side dependency installation"
          echo "📈 Benefits: Fast upload (no node_modules), stable network usage, server-optimized deps"
      # --- 9. SSH deployment verification ---
      - name: Verify SSH Deployment
        env:
          SSH_HOST: ${{ secrets.SFTP_HOST }}
          SSH_USER: ${{ secrets.SFTP_USER }}
          SSH_PASS: ${{ secrets.SFTP_PASS }}
          REMOTE_BASE: ${{ secrets.REMOTE_BASE }}
        run: |
          set -euo pipefail
          echo "🔍 Starting comprehensive deployment verification via SSH..."
          echo "🔍 Verification target: $SSH_USER@$SSH_HOST:$REMOTE_BASE"
          
          sshpass -p "$SSH_PASS" ssh -oStrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" << 'EOF'
            set -euo pipefail
            
            echo "🔍 SSH Verification Session: Connected"
            echo "🔍 Server details:"
            echo "   Hostname: $(hostname)"
            echo "   Current time: $(date -Iseconds)"
            echo "   Working directory: $(pwd)"
            
            # Navigate to app directory
            cd $REMOTE_BASE
            echo "🔍 App directory: $(pwd)"
            
            # Check current release
            echo ""
            echo "🔍 Current release verification:"
            if [ -e "current" ]; then
              echo "✅ Current release exists"
              if [ -L "current" ]; then
                echo "🔗 Current is symlink to: $(readlink current)"
              else
                echo "📂 Current is directory (not symlink)"
              fi
              
              echo "📊 Current release size: $(du -sh current/ | cut -f1)"
              echo "📂 Current release contents:"
              ls -la current/ | head -10
            else
              echo "❌ Current release not found!"
              exit 1
            fi
            
            # Check essential files
            echo ""
            echo "🔍 Essential files verification:"
            
            echo "🔍 Checking SSR entry point..."
            if [ -f "current/dist/server/entry.mjs" ]; then
              echo "✅ SSR entry point found: current/dist/server/entry.mjs"
              echo "📊 SSR entry size: $(ls -lh current/dist/server/entry.mjs | awk '{print $5}')"
            else
              echo "❌ SSR entry point missing!"
              exit 1
            fi
            
            echo "🔍 Checking package.json..."
            if [ -f "current/package.json" ]; then
              echo "✅ Package.json found"
              echo "📋 Package info:"
              grep -E '"name"|"version"' current/package.json || true
            else
              echo "❌ Package.json missing!"
              exit 1
            fi
            
            echo "🔍 Checking production dependencies..."
            if [ -d "current/node_modules" ]; then
              echo "✅ Node modules directory found"
              echo "📊 Node modules size: $(du -sh current/node_modules/ | cut -f1)"
              echo "📦 Number of packages: $(ls current/node_modules/ | wc -l)"
              echo "🔍 Sample packages:"
              ls current/node_modules/ | head -5
            else
              echo "❌ Node modules missing!"
              exit 1
            fi
            
            # Check restart trigger
            echo ""
            echo "🔍 Restart trigger verification:"
            if [ -f "current/tmp/restart.txt" ]; then
              echo "✅ Restart trigger found"
              echo "📅 Restart trigger timestamp: $(stat -c %y current/tmp/restart.txt)"
              echo "⏰ Time since restart: $(( $(date +%s) - $(stat -c %Y current/tmp/restart.txt) )) seconds ago"
            else
              echo "⚠️ Restart trigger file not found"
            fi
            
            # Check release info
            echo ""
            echo "🔍 Release information:"
            if [ -f "current/RELEASE_INFO" ]; then
              echo "✅ Release info found:"
              cat current/RELEASE_INFO
            else
              echo "⚠️ Release info file not found"
            fi
            
            # Check releases directory
            echo ""
            echo "🔍 Releases directory overview:"
            if [ -d "releases" ]; then
              echo "📂 Available releases:"
              ls -la releases/ | tail -10
              echo "📊 Total releases: $(ls releases/ | wc -l)"
              echo "💾 Releases disk usage: $(du -sh releases/ | cut -f1)"
            else
              echo "📂 No releases directory found"
            fi
            
            # Check backup
            echo ""
            echo "🔍 Backup verification:"
            if [ -e "current_old" ]; then
              echo "✅ Previous release backup exists"
              echo "📊 Backup size: $(du -sh current_old/ | cut -f1)"
            else
              echo "🔍 No previous release backup (expected for first deployment)"
            fi
            
            echo ""
            echo "🎉 Deployment verification completed successfully!"
            echo "📋 Verification Summary:"
            echo "   ✅ Current release: Active and verified"
            echo "   ✅ SSR entry point: Found and accessible"
            echo "   ✅ Dependencies: Installed on server"
            echo "   ✅ Restart trigger: Created and timestamped"
            echo "   🚀 Application: Ready to serve requests"
          EOF
          
          echo ""
          echo "✅ SSH deployment verification completed successfully"
          echo "🔍 All critical components verified via SSH"

      # --- 10. SSH deployment completion summary ---
      - name: SSH Deployment Complete
        run: |
          echo "🎉 SSH-only deployment completed successfully!"
          echo ""
          echo "📋 Final Deployment Summary:"
          echo "   🆔 Release ID: $RELEASE_ID"
          echo "   📅 Git SHA: ${{ github.sha }}"
          echo "   🕐 Build Date: $(date -Iseconds)"
          echo "   🔧 Node Version: ${{ env.NODE_VERSION }}"
          echo "   🎯 Target Host: ${{ secrets.SFTP_HOST }}"
          echo "   🚀 Deployment Method: SSH-only (fast & efficient)"
          echo ""
          echo "� SSH Deployment Benefits Achieved:"
          echo "   ⚡ Fast upload: Only dist/ + package files (no node_modules)"
          echo "   🔧 Server-side deps: npm ci --omit=dev executed on target"
          echo "   🎯 Atomic switch: Zero-downtime release activation"
          echo "   📊 Optimized: Server-specific dependency compilation"
          echo "   🛡️ Secure: Password-based SSH with GitHub Secrets"
          echo ""
          echo "�🌐 Live URL: https://lucaknobel.ch"
          echo "✅ Application ready to serve traffic with new release!"
          echo ""
          echo "🔍 Next steps:"
          echo "   • Monitor application logs in hosting panel"
          echo "   • Verify site functionality with hard refresh"
          echo "   • Check performance with new release"
          echo "   • Old release backed up as 'current_old' for rollback if needed"
